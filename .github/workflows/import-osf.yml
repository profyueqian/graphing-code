name: Import OSF collection
on:
  push:
    paths:
      - '.github/workflows/import-osf.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and verify original files
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, zipfile
          from pathlib import Path
          records = json.loads(Path('source-manifest.json').read_text())
          assert len(records) == 66
          with zipfile.ZipFile('osf-import.zip') as archive:
              files = [i for i in archive.infolist() if not i.is_dir()]
              assert {i.filename for i in files} == {r['path'] for r in records}
              for record in records:
                  target = Path(record['path'])
                  assert not target.is_absolute() and '..' not in target.parts
                  data = archive.read(record['path'])
                  assert len(data) == record['bytes']
                  assert hashlib.sha256(data).hexdigest() == record['sha256']
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          print('Verified all 66 original OSF files.')
          Path('osf-import.zip').unlink()
          Path('.github/workflows/import-osf.yml').unlink()
          PYCODE
      - name: Save organized collection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import 66 verified OSF files in their original paper folders'
          git push
